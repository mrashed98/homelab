apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      targetRevision: 3.2.0
      chart: jellyfin
      helm:
        values: |
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - host: jellyfin.voltafinancials.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - hosts:
                  - jellyfin.voltafinancials.com
                secretName: jellyfin-tls
          # /config holds Jellyfin's SQLite DB. On NFS, SQLite locking breaks as
          # soon as two people watch: concurrent playback-progress writes hit
          # "database is locked", requests hang 30-60s, clients show "Oops,
          # something happened", /health times out and the pod is killed (13
          # restarts in 7 days). Databases live on local-path in this cluster;
          # media stays on NFS.
          persistence:
            config:
              enabled: true
              existingClaim: jellyfin-config-local
            media:
              enabled: true
              existingClaim: jellyfin-media
          service:
            type: ClusterIP

          # RWO local volume + SQLite: never let two pods open the DB at once.
          deploymentStrategy:
            type: Recreate

          # One-time copy of the old NFS /config into the new local volume. Runs
          # before Jellyfin starts (Recreate guarantees the old pod is gone), so
          # the DB is quiescent. The marker makes it a no-op on later restarts.
          # ponytail: remove this and the old-config volume once migrated, then
          # delete the old jellyfin-config PVC (annotated Prune=false, PV Retain).
          extraInitContainers:
            - name: migrate-config
              image: busybox:1.36.1
              command:
                - sh
                - -c
                - |
                  set -e
                  if [ -f /config/.migrated-from-nfs ]; then exit 0; fi
                  cp -a /old-config/. /config/
                  touch /config/.migrated-from-nfs
              volumeMounts:
                - name: old-config
                  mountPath: /old-config
                  readOnly: true
                - name: config
                  mountPath: /config
          volumes:
            - name: old-config
              persistentVolumeClaim:
                claimName: jellyfin-config
                readOnly: true

          # Kubernetes defaults these to timeoutSeconds=1 / failureThreshold=3,
          # so Jellyfin has 1s to answer /health, 3 strikes in 30s and it is
          # SIGKILLed (exit 137, "failed liveness probe"). During a library scan
          # it runs ffprobe over NFS per file and routinely blocks longer than
          # that, so every scan was being killed partway through -- 9 restarts in
          # 22h, and newly downloaded episodes never finished indexing. Memory was
          # never the issue (189Mi against a 2Gi limit).
          #
          # Now it takes ~3 minutes of genuine unresponsiveness to trigger a
          # restart, which still catches a real hang but survives an NFS stall.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 2Gi
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-type
                        operator: In
                        values:
                          - worker
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: jellyfin
    # The local-path PVC holding /config (see persistence.config above).
    - repoURL: https://github.com/mrashed98/homelab.git
      targetRevision: master
      path: helm/jellyfin-media
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
