apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: "18.8.13"   # PostgreSQL 18.6.0 — pin chart version for reproducibility
    helm:
      values: |
        fullnameOverride: postgres

        # Bitnami retired versioned tags on Docker Hub (Aug 2025); only ":latest"
        # is published now. A rolling tag on a database is a data-loss risk: when
        # upstream rolls to PG19 the pod will refuse to start on this PG18 data
        # dir. Pin by digest and bump deliberately after checking the major.
        image:
          tag: latest
          digest: "sha256:40a261ed77f3b8dc65eeeec98bb79c4d3ef3410d7e2af7cfcf3785a6af00e4c5"  # 18.6.0

        auth:
          # SealedSecret (see databases-sealed-secret.yaml) provides the superuser password.
          # Secret key must be "postgres-password".
          existingSecret: postgres-admin-secret
          secretKeys:
            adminPasswordKey: postgres-password

        primary:
          persistence:
            enabled: true
            # local-path = K3s built-in node-local provisioner.
            # NEVER use nfs-hdd for PostgreSQL — NFS has broken POSIX file locking
            # which corrupts WAL files and causes data loss.
            storageClass: local-path
            size: 20Gi

          # Enable data checksums to detect corruption early
          initdb:
            args: "--data-checksums"

          # Pin to master — local-path PV is node-local and bound to k3s-master.
          # Toleration allows scheduling despite the control-plane NoSchedule taint.
          nodeSelector:
            kubernetes.io/hostname: k3s-worker-2

          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m

        # Disable read replicas — not needed for homelab
        readReplicas:
          replicaCount: 0

        # Expose on a stable ClusterIP so all namespaces reach it as:
        #   postgres.databases.svc.cluster.local:5432
        service:
          type: ClusterIP
          ports:
            postgresql: 5432

  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
