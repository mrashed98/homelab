apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "88.6.2"
    helm:
      values: |
        fullnameOverride: prometheus

        prometheus:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - prometheus.voltafinancials.com
            tls:
              - hosts:
                  - prometheus.voltafinancials.com
                secretName: prometheus-tls
          prometheusSpec:
            # 1 week of metrics. retentionSize is the important half: all three
            # nodes have only a ~20GB root disk and local-path enforces no quota,
            # so without a hard cap the TSDB grows until the kubelet hits disk
            # pressure and evicts pods (this is what happened on k3s-worker-2 —
            # 42Gi of local-path claims on a 20.6GB disk, TSDB alone was 9GB).
            # Whichever limit trips first wins.
            retention: 7d
            retentionSize: 6GB
            resources:
              requests:
                memory: 512Mi
                cpu: 100m
              limits:
                memory: 768Mi
                cpu: 500m
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      # local-path is a directory on the node root disk (~20.6GB
                      # total), so this request is advisory, not enforced.
                      # retentionSize above is the real ceiling.
                      storage: 20Gi

        grafana:
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - grafana.voltafinancials.com
            tls:
              - hosts:
                  - grafana.voltafinancials.com
                secretName: grafana-tls
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            storageClassName: local-path
            size: 10Gi
          # The local-path PV for Grafana was provisioned on k3s-master, which
          # carries the control-plane NoSchedule taint. Without this toleration
          # the pod is permanently Unschedulable ("didn't match PersistentVolume's
          # node affinity") — it sat Pending for 144 days. Same pattern redis uses.
          nodeSelector:
            kubernetes.io/hostname: k3s-master
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              memory: 200Mi
              cpu: 50m
            limits:
              memory: 384Mi
              cpu: 200m

        alertmanager:
          alertmanagerSpec:
            configSecret: alertmanager-telegram-config
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi

        # k3s embeds scheduler, controller-manager, proxy, and etcd — their scrape
        # endpoints don't exist at the upstream ports kube-prometheus-stack expects,
        # causing KubeSchedulerDown / KubeControllerManagerDown / KubeProxyDown /
        # etcdInsufficientMembers alerts to fire permanently on every k3s cluster.
        kubeScheduler:
          enabled: false

        kubeControllerManager:
          enabled: false

        kubeProxy:
          enabled: false

        kubeEtcd:
          enabled: false

        defaultRules:
          rules:
            etcd: false
            kubeScheduler: false

        nodeExporter:
          enabled: true

        kubeStateMetrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
