apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: "28.0.12"   # Redis 8.10.1 — pinned; "*" made rollbacks impossible
    helm:
      values: |
        fullnameOverride: redis

        # See postgres.yaml — Bitnami only publishes ":latest" now. Pinned by digest.
        image:
          tag: latest
          digest: "sha256:d75bda00b778ad5e03a639ec36e00f6665a5d7e0f35a6250be5b103fb2117275"  # 8.10.1

        # Standalone is sufficient for homelab (no sentinel/replication overhead)
        architecture: standalone

        auth:
          # Disabled for homelab simplicity — Redis holds only ephemeral job state,
          # no sensitive data. Enable and add a SealedSecret if apps store
          # sensitive data in Redis.
          enabled: false

        master:
          persistence:
            enabled: true
            storageClass: local-path
            size: 5Gi
          # Pin to master — local-path PV is node-local and bound to k3s-master.
          # Toleration allows scheduling despite the control-plane NoSchedule taint.
          nodeSelector:
            kubernetes.io/hostname: k3s-master
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m

        # Reachable at: redis-master.databases.svc.cluster.local:6379
        # (Bitnami standalone creates a <fullname>-master service)
        service:
          type: ClusterIP
          ports:
            redis: 6379

  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
