# File Browser Quantum -- the maintained fork of filebrowser/filebrowser, which
# was archived on 2026-09-01 with an unfixed high-severity advisory (upload
# cleanup recursively deleting directories). Same UI, still getting fixes.
image:
  repository: ghcr.io/gtsteffaniak/filebrowser
  # NB: the image tag has no "v" prefix even though the GitHub release does.
  tag: 1.5.5-stable
  pullPolicy: IfNotPresent

ingress:
  host: files.voltafinancials.com

# The point of this app is to LOOK at media, not change it. Both shares are
# mounted read-only at the pod level -- that is the real guarantee, and it holds
# whatever the app itself thinks it is allowed to do. Flip to false if you ever
# want to tidy files from the browser.
shares:
  # readOnly is per-share now. Media stays read-only on purpose: this exists to
  # check that downloads landed, not to reorganise a 500GB library.
  #
  # Deliberately NOT exposing /mnt/pve/BigData or its k3s-shares root as
  # writable. BigData/images holds the VM disks for all three k3s nodes, and
  # k3s-shares holds Vaultwarden's vault plus every Postgres PVC -- one stray
  # delete there takes out the cluster. "files" is a dedicated general-purpose
  # area instead, and k3s-shares is mounted read-only for visibility.
  media:
    enabled: true
    readOnly: true
    server: 192.168.68.100
    path: /mnt/pve/BigData/k3s-shares/media
    capacity: 500Gi
  transmission:
    enabled: true
    readOnly: true
    server: 192.168.68.100
    path: /mnt/pve/BigData/k3s-shares/transmission
    capacity: 500Gi
  # General-purpose writable space -- private files, and a path Nextcloud or
  # anything else can mount later. 1.4TB free on the underlying disk.
  files:
    enabled: true
    readOnly: false
    server: 192.168.68.100
    path: /mnt/pve/BigData/files
    capacity: 500Gi
  # Read-only window onto every app's PVC data, for investigating without
  # being able to destroy anything.
  appdata:
    enabled: true
    readOnly: true
    server: 192.168.68.100
    path: /mnt/pve/BigData/k3s-shares
    capacity: 500Gi

# Holds the SQLite db and the thumbnail cache. On NFS rather than local-path
# because every node root disk is ~20GB and already tight; the NFS export has
# over a terabyte free, and the cache grows with the size of the library.
data:
  storageClass: nfs-hdd
  size: 10Gi

# Existing secret with key "password" -- the initial admin password.
# Sealed into admin-sealed-secret.yaml; change it in the UI whenever you like,
# the init step only runs while the database does not yet exist.
adminPasswordSecret: filebrowser-admin
adminUsername: admin

# Image is built to run as uid/gid 1000; fsGroup lets it write to the NFS PVC.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 1000m

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-type
              operator: In
              values:
                - worker
