image:
  repository: python
  tag: 3.13-alpine
  pullPolicy: IfNotPresent

# Last path segment of the product URL on eshop.orange.eg
seName: iphone-18-pro-max
intervalSeconds: 30
# TradeLine rate-limits hard: one product request per this many seconds (round-robin, backs off on 429)
shopifyIntervalSeconds: 300
# Shopify product pages to watch (one URL per colour/storage on TradeLine)
shopifyProducts:
  - https://tradelinestores.com/products/iphone-18-pro-mjxn4af-a  # Pro Max 256GB Black
  - https://tradelinestores.com/products/iphone-18-pro-mjxq4af-a  # Pro Max 256GB Burgundy
  - https://tradelinestores.com/products/iphone-18-pro-mjxr4af-a  # Pro Max 256GB Glacier
  - https://tradelinestores.com/products/iphone-18-pro-mjxp4af-a  # Pro Max 256GB Silver
# Alertmanager already routes everything to the Homealert Telegram chat
alertmanagerUrl: http://prometheus-alertmanager.monitoring:9093

resources:
  requests:
    memory: 24Mi
    cpu: 10m
  limits:
    memory: 64Mi
    cpu: 100m
