{{- if eq .Values.image.tag "TBD" }}
{{- fail "set image.tag to a Daddy main commit SHA that CI has pushed" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Env is read only at start: roll when a secret is resealed.
        checksum/app: {{ include (print $.Template.BasePath "/app-sealed.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.secrets.pull }}
      automountServiceAccountToken: false
      # Plans take up to 85 s; the server drains for up to 90 s on SIGTERM.
      terminationGracePeriodSeconds: 100
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # distroless nonroot
        runAsGroup: 65532
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.app }}
          env:
            - name: AI_PROVIDERS
              value: {{ .Values.aiProviders | quote }}
            - name: APPLE_BUNDLE_ID
              value: {{ .Values.appleBundleID | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:   # TCP: a database outage shouldn't restart the API
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Only the Cloudflare Tunnel (public traffic) and the nodes (kubelet probes) reach the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
        {{- range .Values.nodeIPs }}
        - ipBlock:
            cidr: {{ . }}/32
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
