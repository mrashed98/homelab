# Nightly logical backup to NFS (off the database node's disk), kept backup.keepDays days.
# Restore: gunzip -c daddy-<date>.sql.gz | psql -h daddy-postgres -U daddy daddy
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daddy-backups
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.backup.storageClass }}
  resources:
    requests:
      storage: {{ .Values.backup.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daddy-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: daddy-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: pg-dump
              image: {{ .Values.postgres.image | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.postgres }}
                      key: POSTGRES_PASSWORD
              command: ["/bin/sh", "-ec"]
              # Write to a temp name and rename, so a failed dump never looks like a backup.
              args:
                - |
                  f=/backup/daddy-$(date +%Y%m%d-%H%M).sql.gz
                  pg_dump -h daddy-postgres -U daddy daddy | gzip > "$f.tmp"
                  mv "$f.tmp" "$f"
                  find /backup -name 'daddy-*.sql.gz' -mtime +{{ .Values.backup.keepDays }} -delete
                  ls -l /backup
              volumeMounts:
                - name: backups
                  mountPath: /backup
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: daddy-backups
