apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.68.100
    path: /mnt/pve/BigData/k3s-shares/media
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 500Gi
  volumeName: jellyfin-media
  storageClassName: manual
---
# Jellyfin /config (SQLite DB + metadata). local-path, not NFS: SQLite locking
# over NFS breaks under concurrent playback. Ties Jellyfin to one node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-local
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
