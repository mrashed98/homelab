apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: {{ .Release.Namespace }}
spec:
  basicAuth:
    secret: {{ .Values.secrets.basicAuth }}
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.dashboardHost }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.dashboardHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
---
# Chrome fetches the PWA manifest and its icons without credentials, so behind basic auth the
# app can only be added as a shortcut. These files are static and hold nothing private; exact
# paths only (Traefik ranks these longer rules above the authenticated "/" prefix).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-pwa
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.dashboardHost }}
      secretName: {{ .Release.Name }}-tls   # issued for the main ingress
  rules:
    - host: {{ .Values.dashboardHost }}
      http:
        paths:
          {{- range list "/manifest.webmanifest" "/sw.js" "/static/icon-192.png" "/static/icon-512.png" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  name: http
          {{- end }}
