image:
  repository: vaultwarden/server
  tag: 1.37.2-alpine
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: vault.voltafinancials.com

env:
  DOMAIN: https://vault.voltafinancials.com
  # Open registration on an internet-reachable password manager lets anyone
  # who finds the host create an account. Invite users from the admin page
  # instead (set ADMIN_TOKEN), or flip this back briefly to onboard someone.
  SIGNUPS_ALLOWED: "false"
  WEBSOCKET_ENABLED: "true"

resources:
  requests:
    memory: 32Mi
    cpu: 25m
  limits:
    memory: 128Mi
    cpu: 100m

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-type
              operator: In
              values:
                - worker

topologySpread:
  enabled: true

