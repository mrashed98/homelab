---
- name: Setup for k3s
  hosts: k3s_cluster
  become: true

  tasks:
    - name: Update cache and install curl
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Install nfs-common for storage support
      ansible.builtin.apt:
        name: nfs-common
        state: present

- name: install k3s on master
  hosts: master
  become: true

  tasks:
    - name: Install k3s
      ansible.builtin.shell:
        creates: /usr/local/bin/k3s
        cmd: curl -sfL https://get.k3s.io | sh -

    - name: Wait for the token to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        state: present
        timeout: 6000

    - name: Get the K3s join token from the master
      ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
      register: master_token_output

    - name: Show me what was captured
      ansible.builtin.debug:
        msg: "The token is {{ master_token_output.stdout }}"

    - name: Install Helm via script
      ansible.builtin.shell:
        cmd: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        creates: /usr/local/bin/helm
    
- name: Install k3s on workers
  hosts: workers
  become: true

  tasks:
    - name: Join Workers to the cluster
      ansible.builtin.shell:
        cmd: curl -sfL https://get.k3s.io | sh -
        # without this every re-run silently upgrades k3s on the workers
        creates: /usr/local/bin/k3s
      environment:
        K3S_URL: "https://192.168.68.150:6443"
        K3S_TOKEN: "{{ hostvars['192.168.68.150']['master_token_output']['stdout'] }}"

    - name: Create a partition and format the 100GB disk
      community.general.filesystem:
        fstype: ext4
        dev: /dev/vdb  # In KVM, virtio1 usually shows as /dev/vdb
        force: no

    - name: Create data directory
      ansible.builtin.file:
        path: /mnt/k3s-data
        state: directory
        mode: '0755'

    - name: Mount the 100GB disk
      ansible.posix.mount:
        path: /mnt/k3s-data
        src: /dev/vdb
        fstype: ext4
        state: mounted

    # local-path writes to /var/lib/rancher/k3s/storage on the 20GB root disk.
    # Bind-mounting the data disk over it keeps every existing PV path valid.
    - name: Check whether local-path storage is already on the data disk
      ansible.builtin.command: findmnt -n /var/lib/rancher/k3s/storage
      register: storage_mount
      failed_when: false
      changed_when: false

    - name: Look for volumes the bind mount would hide
      ansible.builtin.find:
        paths: /var/lib/rancher/k3s/storage
        file_type: any
      register: old_volumes
      when: storage_mount.rc != 0

    - name: Refuse to mount over existing volumes
      ansible.builtin.fail:
        msg: >-
          /var/lib/rancher/k3s/storage has {{ old_volumes.matched }} volume(s) on the root disk.
          Scale their pods to 0, cp -a them to /mnt/k3s-data/storage, then re-run.
      when: storage_mount.rc != 0 and old_volumes.matched > 0

    - name: Create local-path directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /mnt/k3s-data/storage
        - /var/lib/rancher/k3s/storage

    - name: Bind-mount data disk as local-path storage
      ansible.posix.mount:
        path: /var/lib/rancher/k3s/storage
        src: /mnt/k3s-data/storage
        fstype: none
        opts: bind
        state: mounted